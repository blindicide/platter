name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every step runs in bash, including on Windows (Git Bash). No PowerShell.
defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Linux (GCC, Qt 6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build qt6-base-dev qt6-tools-dev qt6-l10n-tools nlohmann-json3-dev catch2 fdisk fonts-liberation libzstd-dev zstd

      - name: Configure
        run: scripts/ci-run.sh "Linux configure" cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPLATTER_WERROR=ON

      - name: Build
        run: scripts/ci-run.sh "Linux build" cmake --build build

      - name: Unit tests
        run: scripts/ci-run.sh "Linux tests" ctest --test-dir build --output-on-failure

      - name: CLI smoke test (images only)
        run: |
          truncate -s 64M smoke.img
          printf 'label: gpt\nsize=16MiB, name="one"\nname="two"\n' | sfdisk -q smoke.img
          ./build/src/platter-cli --version
          ./build/src/platter-cli partitions list smoke.img

      - name: GUI smoke test, English and Russian (offscreen, images only)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./build/src/platter-gui smoke.img --size 1000x700 --screenshot gui-en.png
          ./build/src/platter-gui smoke.img --lang ru --size 1000x700 --screenshot gui-ru.png
          test -s gui-en.png && test -s gui-ru.png
          ./build/src/platter-cli partitions list --json smoke.img > partitions.json
          set +e; ./build/src/platter-cli smart show smoke.img; rc=$?; set -e
          test "$rc" -eq 7   # SMART on an image must be "unsupported"

      - name: CLI imaging smoke test (temp images only)
        run: |
          cli=./build/src/platter-cli
          $cli image create smoke.img smoke.img.zst -q
          test "$(cut -d' ' -f1 smoke.img.zst.sha256)" = "$(zstd -dc smoke.img.zst | sha256sum | cut -d' ' -f1)"
          $cli image verify smoke.img.zst --against smoke.img -q
          truncate -s 64M restored.img
          $cli image restore smoke.img.zst restored.img --confirm restored.img -q
          cmp smoke.img restored.img
          truncate -s 64M cloned.img
          $cli clone smoke.img cloned.img --confirm cloned.img -q
          cmp smoke.img cloned.img

      - name: CLI inspect / qualify smoke test (temp images only)
        run: |
          cli=./build/src/platter-cli
          $cli hex smoke.img --lba 1 | grep -q "EFI PART"
          $cli find smoke.img --ascii "EFI PART" | grep -q "2 matches"
          truncate -s 8M qual.img
          export PLATTER_HISTORY_DB="$PWD/history.db"
          $cli qualify run qual.img --confirm qual.img --passes 1 --samples 16 --no-smart --save -q
          $cli history list | grep -q qualification
          $cli qualify history | grep -q PASS

      - name: GUI smoke test (offscreen screenshot)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./build/src/platter-gui smoke.img --tab PARTITIONS --size 1000x700 --screenshot gui-linux.png
          test -s gui-linux.png
          ./build/src/platter-gui smoke.img --tab HEX --size 1000x700 --screenshot gui-hex.png
          test -s gui-hex.png
          for d in preferences help history checksum; do
            ./build/src/platter-gui --dialog-screenshot "$d=dlg-$d.png"
            test -s "dlg-$d.png"
          done

      - name: Release archive
        run: |
          cmake --install build --component Runtime --prefix "$PWD/build/stage"
          (cd build && cpack -G TGZ)

      - uses: actions/upload-artifact@v4
        with:
          name: platter-linux-x86_64
          path: |
            build/platter-*.tar.gz
            gui-linux.png
            partitions.json

  windows:
    name: Windows (MSVC, Qt 6)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          arch: win64_msvc2019_64
          cache: true

      - name: Configure
        # No explicit generator: CMake picks the newest Visual Studio on the image.
        run: |
          cmake --version
          scripts/ci-run.sh "Windows configure" cmake -S . -B build -A x64
          version="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/CMakeCache.txt)"
          test -n "$version"
          echo "PLATTER_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: scripts/ci-run.sh "Windows build" cmake --build build --config Release --parallel

      - name: Unit tests
        run: scripts/ci-run.sh "Windows tests" ctest --test-dir build -C Release --output-on-failure

      - name: CLI smoke test (images only)
        run: |
          ./build/src/Release/platter-cli.exe --version
          # A blank 8 MiB image: unpartitioned, read through the Win32 backend.
          head -c 8388608 /dev/zero > blank.img
          ./build/src/Release/platter-cli.exe partitions list blank.img
          ./build/src/Release/platter-cli.exe devices info blank.img

      - name: GUI smoke test (offscreen screenshot)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./build/src/Release/platter-gui.exe blank.img --size 1000x700 --screenshot gui-windows.png
          ./build/src/Release/platter-gui.exe blank.img --lang ru --size 1000x700 --screenshot gui-windows-ru.png
          test -s gui-windows.png
          test -s gui-windows-ru.png

      - name: Package
        run: |
          cmake --install build --config Release --component Runtime --prefix "$PWD/dist/platter"
          windeployqt --release --translations ru --no-opengl-sw dist/platter/app/platter-gui.exe

      # smartmontools (GPL-2.0-or-later) is shipped unmodified as a separate program that platter
      # runs for SMART data; see packaging/windows/SMARTMONTOOLS.txt.
      - name: Bundle smartctl
        run: |
          choco install smartmontools -y --no-progress
          SM="/c/Program Files/smartmontools"
          mkdir -p dist/platter/app/smartmontools
          cp "$SM/bin/smartctl.exe" dist/platter/app/smartmontools/
          cp packaging/licenses/GPL-2.txt dist/platter/app/smartmontools/COPYING.txt
          find "$SM" -iname drivedb.h -exec cp '{}' dist/platter/app/smartmontools/ \;
          cp packaging/windows/SMARTMONTOOLS.txt dist/platter/app/smartmontools/README.txt
          dist/platter/app/smartmontools/smartctl.exe --version | head -3
          ls dist/platter/app/smartmontools

      - name: Portable package smoke test (images only)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for item in dist/platter/*; do
            case "${item##*/}" in
              platter.exe|platter-cli.exe|app|docs) ;;
              *) echo "Unexpected package entry: $item"; exit 1 ;;
            esac
          done
          test -s dist/platter/app/translations/qt_ru.qm
          mkdir -p "package smoke"
          cp blank.img "package smoke/sample disk.img"
          (
            cd "package smoke"
            "$GITHUB_WORKSPACE/dist/platter/platter-cli.exe" --version
            "$GITHUB_WORKSPACE/dist/platter/platter-cli.exe" devices info "sample disk.img"
            set +e
            "$GITHUB_WORKSPACE/dist/platter/platter-cli.exe" smart show "sample disk.img"
            rc=$?
            set -e
            test "$rc" -eq 7
            "$GITHUB_WORKSPACE/dist/platter/platter.exe" "sample disk.img" --lang ru --screenshot portable.png
            test -s portable.png
          )

      - name: Zip release
        run: 7z a "platter-${PLATTER_VERSION}-windows-x64.zip" ./dist/platter

      - uses: actions/upload-artifact@v4
        with:
          name: platter-windows-x64
          path: |
            platter-${{ env.PLATTER_VERSION }}-windows-x64.zip
            gui-windows.png

  windows-cross:
    name: Windows cross-compile (MinGW, core + CLI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64 ninja-build
      - name: Configure
        run: >
          cmake -S . -B build-win -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw-w64-x86_64.cmake
          -DPLATTER_BUILD_GUI=OFF -DPLATTER_BUILD_TESTS=OFF -DPLATTER_WERROR=ON
      - name: Build
        run: scripts/ci-run.sh "MinGW build" cmake --build build-win
